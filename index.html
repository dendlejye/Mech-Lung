<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Interactive 3D model of the mechanical lung rig built for a Victoria University capstone project on upper airway pressure testing.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}[hidden]{display:none!important}*{box-sizing:border-box}</style>
<title>Mechanical Lung Rig</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-height stage (the 3D model) with instrument-style overlays: name plate top-left, live readout top-right, control strip along the bottom. */
:root {
  --stage: #dfe3e6;        /* studio backdrop behind the bench */
  --stage-2: #c9cfd4;
  --panel: rgba(250, 251, 252, 0.86);
  --fg: #1b2227;
  --muted: #5b6770;
  --line: rgba(27, 34, 39, 0.16);
  --accent: #c8560a;       /* the lever-connector orange on the rig */
  --accent-fg: #ffffff;
  --trace: #0b7a8f;
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --stage: #1a1e22; --stage-2: #101316; --panel: rgba(28, 33, 38, 0.84); --fg: #e8ecef; --muted: #9aa6ae;
    --line: rgba(232, 236, 239, 0.16); --accent: #f08a2c; --accent-fg: #1a1206; --trace: #5cc8dc; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --stage: #1a1e22; --stage-2: #101316; --panel: rgba(28, 33, 38, 0.84); --fg: #e8ecef; --muted: #9aa6ae;
  --line: rgba(232, 236, 239, 0.16); --accent: #f08a2c; --accent-fg: #1a1206; --trace: #5cc8dc; color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: radial-gradient(120% 90% at 50% 35%, var(--stage), var(--stage-2));
  color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.4; overflow: hidden;
}
#stage { position: relative; height: 100%; width: 100%; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.plate {
  position: absolute; background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
#name {
  top: 14px; left: max(16px, env(safe-area-inset-left, 0px)); padding: 10px 14px; max-width: min(340px, calc(100% - 32px));
}
#name h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: 0.01em; text-wrap: balance; }
#name p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
#readout {
  top: 14px; right: max(16px, env(safe-area-inset-right, 0px)); padding: 9px 13px; font-family: var(--font-data); font-size: 12.5px;
  font-variant-numeric: tabular-nums; display: grid; grid-template-columns: auto auto; column-gap: 12px; row-gap: 2px; min-width: 196px;
}
#readout dt { color: var(--muted); }
#readout dd { margin: 0; text-align: right; }
#readout .q { color: var(--trace); font-weight: 500; }
#part {
  left: 50%; transform: translateX(-50%); bottom: calc(100% + 10px); padding: 5px 11px; font-size: 13px; white-space: nowrap;
  max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis;
}
#dock {
  position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#controls {
  position: relative; pointer-events: auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px;
  padding: 8px 12px; max-width: 100%;
}
.group { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
.group + .group { padding-left: 14px; border-left: 1px solid var(--line); }
.lbl { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
button, select {
  font: inherit; font-size: 13px; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 4px;
  padding: 5px 9px; cursor: pointer;
}
select { padding-right: 6px; }
button:hover, select:hover { border-color: var(--fg); }
button:focus-visible, select:focus-visible, #view:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
#name #hint { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); font-size: 12px; }
#load {
  position: absolute; inset: 0; display: grid; place-content: center; gap: 10px; text-align: center; color: var(--muted); font-family: var(--font-data); font-size: 13px;
}
#bar { width: 220px; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
#bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }
@media (max-width: 720px) {
  #name p { display: none; }
  #name { padding: 7px 11px; }
  #name h1 { font-size: 15px; }
  #readout { top: 58px; left: max(16px, env(safe-area-inset-left, 0px)); right: auto; min-width: 0; font-size: 12px; padding: 7px 10px; }
  .group + .group { padding-left: 0; border-left: 0; }
  .lbl { display: none; }
}
</style>

</head>
<body>
<div id="stage">
  <canvas id="view" tabindex="0" aria-label="Interactive 3D model of the mechanical lung rig. Drag to orbit, scroll or pinch to zoom."></canvas>

  <div id="load"><div>Loading model…</div><div id="bar"><i></i></div></div>

  <div id="name" class="plate">
    <h1>Mechanical Lung Rig</h1>
    <p id="hint">Drag to orbit, scroll to zoom, right-drag to pan. Click a part or wire to name it.</p>
  </div>

  <dl id="readout" class="plate" aria-live="off">
    <dt>Flow</dt><dd class="q" id="r-q">0.0 L/min</dd>
    <dt>Phase</dt><dd id="r-ph">held</dd>
    <dt>Piston</dt><dd id="r-x">0.0 mm</dd>
    <dt>Breath</dt><dd id="r-t">–</dd>
  </dl>

  <div id="dock">
    <div id="controls" class="plate">
      <div id="part" class="plate" hidden></div>
      <div class="group" role="group" aria-label="Views">
        <span class="lbl">View</span>
        <button type="button" data-view="overview" aria-pressed="true">Overview</button>
        <button type="button" data-view="lung" aria-pressed="false">Lung</button>
        <button type="button" data-view="actuator" aria-pressed="false">Actuator</button>
        <button type="button" data-view="electronics" aria-pressed="false">Electronics</button>
        <button type="button" data-view="wiring" aria-pressed="false">Wiring</button>
        <button type="button" data-view="junction" aria-pressed="false">Junction</button>
        <button type="button" data-view="airway" aria-pressed="false">Airway</button>
        <button type="button" data-view="top" aria-pressed="false">Top</button>
      </div>
      <div class="group">
        <span class="lbl">Breathing</span>
        <button type="button" id="play" aria-pressed="true">Run</button>
        <select id="preset" aria-label="Breathing preset, peak inspiratory flow">
          <option value="0">10 L/min</option>
          <option value="1">15 L/min</option>
          <option value="2" selected>20 L/min</option>
          <option value="3">30 L/min</option>
        </select>
      </div>
      <div class="group">
        <button type="button" id="bench" aria-pressed="true">Bench gear</button>
        <button type="button" id="lid" aria-pressed="true">Junction lid</button>
      </div>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const MODEL_URL = 'mech_lung_rig.glb';   // binary glTF with its textures embedded
const canvas = document.getElementById('view');
const stage = document.getElementById('stage');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.92;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.03).texture;

const camera = new THREE.PerspectiveCamera(32, 1, 0.02, 40);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 0.12; controls.maxDistance = 6; controls.maxPolarAngle = Math.PI * 0.497;
controls.zoomToCursor = true;

const key = new THREE.DirectionalLight(0xfff4e6, 3.0);
key.position.set(0.2, 2.6, 1.6); key.target.position.set(0.85, 0, 0);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -1.5, right: 1.5, top: 1.2, bottom: -1.2, near: 0.5, far: 6 });
key.shadow.bias = -0.0003; key.shadow.normalBias = 0.004; key.shadow.radius = 5;
scene.add(key, key.target);
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f96, 0.25));

/* Views: camera position and target in metres (x along the flow axis, y up, z toward the operator). */
const VIEWS = {
  overview:    { p: [1.98, 0.80, 1.34], t: [0.88, 0.0, 0.07] },
  lung:        { p: [1.14, 0.50, 0.80], t: [0.57, 0.05, 0.03] },
  actuator:    { p: [-0.34, 0.34, 0.50], t: [0.26, 0.08, 0.0] },
  electronics: { p: [1.01, 0.40, 0.40], t: [0.879, 0.012, 0.03] },
  wiring:      { p: [0.884, 0.43, 0.125], t: [0.880, 0.012, 0.034] },
  junction:    { p: [0.648, 0.27, -0.36], t: [0.606, 0.012, -0.113] },
  airway:      { p: [1.56, 0.30, 0.54], t: [1.20, 0.05, 0.02] },
  top:         { p: [0.74, 2.05, 0.04], t: [0.74, 0.0, 0.0] },
};
let fly = null;
function fit(v) {
  const aspect = stage.clientWidth / Math.max(stage.clientHeight, 1);
  const k = Math.max(1, 1.8 / aspect);
  const t = new THREE.Vector3(...v.t), p = new THREE.Vector3(...v.p);
  return { t, p: t.clone().add(p.sub(t).multiplyScalar(k)) };
}
function goView(name, instant) {
  const { p, t } = fit(VIEWS[name]);
  document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === name)));
  if (instant || reduceMotion) { camera.position.copy(p); controls.target.copy(t); controls.update(); fly = null; return; }
  fly = { p0: camera.position.clone(), t0: controls.target.clone(), p1: p, t1: t, s: performance.now(), d: 900 };
}
document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { if (b.dataset.view === 'junction') setLid(false); goView(b.dataset.view); }));
controls.addEventListener('start', () => { fly = null; document.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', 'false')); });

/* Breathing: 700 mL tidal volume, I:E 1:2. Push (expiration, out through the trachea) at half the preset flow, return (inspiration) at the preset peak. */
const BORE_MM = 129.15, VT_ML = 700;
const AREA_MM2 = Math.PI * (BORE_MM / 2) ** 2;
const STROKE_MM = VT_ML * 1000 / AREA_MM2;            // 53.4 mm
const Q_PEAK = [10, 15, 20, 30];                       // L/min
let preset = 2, playing = !reduceMotion, tBreath = 0, moving = null, benchGear = [];
const period = () => { const ti = Math.PI * (VT_ML / 1000) / (2 * (Q_PEAK[preset] / 60)); return { ti, te: 2 * ti, T: 3 * ti }; };
function pistonState(t) {
  const { ti, te, T } = period(); const a = STROKE_MM / 2; const ph = ((t % T) + T) % T;
  if (ph < te) return { x: -a * Math.cos(Math.PI * ph / te), v: a * Math.PI / te * Math.sin(Math.PI * ph / te), phase: 'expiration', T, ph };
  const u = ph - te;
  return { x: a * Math.cos(Math.PI * u / ti), v: -a * Math.PI / ti * Math.sin(Math.PI * u / ti), phase: 'inspiration', T, ph };
}
const rq = document.getElementById('r-q'), rph = document.getElementById('r-ph'), rx = document.getElementById('r-x'), rt = document.getElementById('r-t');
function showState(s) {
  const q = s.v * AREA_MM2 * 60 / 1e6;                // + out of the cylinder, as logged on the rig
  rq.textContent = (q >= 0 ? '+' : '−') + Math.abs(q).toFixed(1) + ' L/min';
  rph.textContent = playing ? s.phase : 'held';
  rx.textContent = (s.x >= 0 ? '+' : '−') + Math.abs(s.x).toFixed(1) + ' mm';
  rt.textContent = s.ph.toFixed(1) + ' / ' + s.T.toFixed(1) + ' s';
}
const playBtn = document.getElementById('play');
playBtn.setAttribute('aria-pressed', String(playing));
playBtn.addEventListener('click', () => { playing = !playing; playBtn.setAttribute('aria-pressed', String(playing)); });
document.getElementById('preset').addEventListener('change', e => { preset = +e.target.value; tBreath = 0; });
let lidObj = null;
const lidBtn = document.getElementById('lid');
function setLid(on) { lidBtn.setAttribute('aria-pressed', String(on)); if (lidObj) lidObj.visible = on; }
lidBtn.addEventListener('click', () => setLid(lidBtn.getAttribute('aria-pressed') !== 'true'));
const benchBtn = document.getElementById('bench');
benchBtn.addEventListener('click', () => {
  const on = benchBtn.getAttribute('aria-pressed') !== 'true';
  benchBtn.setAttribute('aria-pressed', String(on)); benchGear.forEach(o => o.visible = on);
});

/* Click a part to read its name. */
const partEl = document.getElementById('part');
const showPart = on => { partEl.hidden = !on; };
const ray = new THREE.Raycaster(); let down = null, partTimer = 0; const pickables = [];
canvas.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  const r = canvas.getBoundingClientRect();
  ray.setFromCamera(new THREE.Vector2((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), camera);
  const hits = ray.intersectObjects(pickables, false).filter(h => h.object.visible);
  let hit = hits[0];
  // looking through clear walls: prefer what is inside when the first hit is the acrylic
  if (hit && hits[1] && /acrylic/i.test(hit.object.material.name)) hit = hits.find(h => !/acrylic/i.test(h.object.material.name)) || hit;
  if (!hit) { showPart(false); return; }
  let o = hit.object, n = o.userData.name || o.name;
  if (/^(Mechanical lung rig|Bench context)$/.test(o.parent?.userData?.name || '') === false && o.parent?.userData?.name) n = n + '  ·  ' + o.parent.userData.name.replace(/ \(moving\)/, '');
  partEl.textContent = n.replace(/\.\d{3}/g, '').replace(/_/g, ' ');
  showPart(true); clearTimeout(partTimer); partTimer = setTimeout(() => showPart(false), 6000);
});

/* Load */
const bar = document.querySelector('#bar i'), loadEl = document.getElementById('load');
function onModel(gltf) {
  const root = gltf.scene;
  root.traverse(o => {
    const nm = o.userData.name || o.name || '';
    if (/Piston assembly/.test(nm)) moving = o;
    if (/^(Bench power supply|Logging PC)$/.test(nm)) benchGear.push(o);
    if (nm === 'Junction box lid') lidObj = o;
    if (!o.isMesh) return;
    pickables.push(o);
    const m = o.material; const clear = m.transmission > 0.4;
    o.castShadow = !clear; o.receiveShadow = true;
    if (m.transmission > 0) { m.transparent = false; m.opacity = 1; m.depthWrite = true; }   // file carries an alpha fallback; use real transmission here
    if (m.map) m.map.anisotropy = 8;
    m.envMapIntensity = 0.8;
    if (/Clear acrylic/.test(m.name)) { m.thickness = 0.0; m.roughness = 0.04; m.ior = 1.49; m.envMapIntensity = 1.3; m.side = THREE.DoubleSide; }
    else if (/Sawn acrylic/.test(m.name)) { m.thickness = 0.004; m.roughness = 0.55; }
    else if (/Printed resin/.test(m.name)) { m.thickness = 0.004; m.roughness = 0.3; m.attenuationColor = new THREE.Color(0xdfe6e2); m.attenuationDistance = 0.08; }
    else if (/Silicone/.test(m.name)) { m.thickness = 0.003; m.roughness = 0.5; }
    else if (/Lever connector body/.test(m.name)) { m.thickness = 0.004; }
  });
  scene.add(root);
  loadEl.hidden = true;
  goView('overview', true);
  showState(pistonState(0));
}
const fail = err => { loadEl.firstElementChild.textContent = 'The model file did not load. Reload the page to try again.'; console.error(err); };
new GLTFLoader().load(MODEL_URL, onModel,
  ev => { if (ev.total) bar.style.width = Math.round(ev.loaded / ev.total * 100) + '%'; }, fail);

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / Math.max(h, 1); camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage); resize();

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (fly) {
    let k = Math.min((now - fly.s) / fly.d, 1); k = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    camera.position.lerpVectors(fly.p0, fly.p1, k); controls.target.lerpVectors(fly.t0, fly.t1, k);
    if (k >= 1) fly = null;
  }
  if (moving) {
    if (playing) tBreath += dt;
    const s = pistonState(tBreath);
    moving.position.x = s.x / 1000;
    showState(playing ? s : { ...s, v: 0 });
  }
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

</body>
</html>
